name: Update profile art

"on":
  schedule:
    - cron: "27 * * * *"   # Runs hourly at minute 27 to avoid top-of-hour GitHub runner queue load
  workflow_dispatch: {}
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py Sthitadhi1
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_info_card.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: real-time refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg"
