<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 560" width="490" height="560">
<style>
  .card-bg { fill: #0d1117; rx: 8px; stroke: #30363d; stroke-width: 1px; }
  .title-bar { fill: #161b22; rx: 8px 8px 0 0; }
  .title-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #8b949e; font-weight: 600; }
  .dot-red { fill: #ff5f56; }
  .dot-yellow { fill: #ffbd2e; }
  .dot-green { fill: #27c93f; }
  .prompt { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #58a6ff; font-weight: bold; }
  .key { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; fill: #79c0ff; font-weight: 600; }
  .val { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; fill: #c9d1d9; }
  .accent { fill: #d2a8ff; font-weight: 600; }
  @keyframes fadeInSlide {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-line { opacity: 0; animation: fadeInSlide 0.4s ease-out forwards; }
</style>
<rect class="card-bg" width="490" height="560" />
<path d="M 0 0 h 490 a 8 8 0 0 1 8 8 v 28 h -498 v -28 a 8 8 0 0 1 8 -8 z" fill="#161b22"/>
